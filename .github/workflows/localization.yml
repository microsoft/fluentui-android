trigger: none
pr: none

pool:
  vmImage: ubuntu-22.04

variables:
  GITHUB_REPOSITORY: microsoft/fluentui-android
  BASE_BRANCH: master

steps:
- checkout: self
  clean: true

- task: AzureCLI@2
  displayName: Get access token for TouchDown Build
  inputs:
    azureSubscription: 'onebranch-pipelines-kv'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -e

      echo "Getting TouchDown Build token using Azure DevOps service connection..."

      TOKEN=$(az account get-access-token \
        --scope https://prdtrs01.onmicrosoft.com/touchdownbuildservice_prod/.default \
        --query accessToken \
        -o tsv)

      if [ -z "$TOKEN" ]; then
        echo "ERROR: Failed to get TouchDown Build access token"
        exit 1
      fi

      echo "##vso[task.setsecret]$TOKEN"
      echo "##vso[task.setvariable variable=TD_ACCESS_TOKEN;issecret=true]$TOKEN"

      echo "Token acquired successfully. Length: ${#TOKEN}"

- script: |
    set -e

    echo "Running localization script..."

    chmod +x ./localize.sh
    ./localize.sh
  displayName: Localize
  env:
    TDBUILD_TEAM_ID: $(TDBUILD_TEAM_ID)
    TD_ACCESS_TOKEN: $(TD_ACCESS_TOKEN)

- script: |
    set -e

    echo "Creating localization pull request..."

    if [ -z "$GH_TOKEN" ]; then
      echo "ERROR: GH_TOKEN pipeline variable is missing"
      exit 1
    fi

    if [ -z "$EMAIL" ]; then
      echo "ERROR: EMAIL pipeline variable is missing"
      exit 1
    fi

    if [ -z "$NAME" ]; then
      echo "ERROR: NAME pipeline variable is missing"
      exit 1
    fi

    if ! command -v gh >/dev/null 2>&1; then
      echo "ERROR: GitHub CLI 'gh' is not available on this agent"
      exit 1
    fi

    echo "##vso[task.setsecret]$GH_TOKEN"

    git config --global user.email "$EMAIL"
    git config --global user.name "$NAME"
    git config pull.rebase false

    git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

    branch="Localize-${BUILD_BUILDID}"
    message="TDBuild Localization"

    echo "Creating branch $branch"
    git checkout -b "$branch"

    git add .

    if [[ `git status --porcelain` ]]; then
      echo "Adding git commit"
      git commit -m "Adding localized files"

      echo "Pushing branch to origin"
      git push origin "$branch"

      echo "Creating PR"
      gh api \
        --method POST \
        -H "Accept: application/vnd.github+json" \
        "/repos/${GITHUB_REPOSITORY}/pulls" \
        -f title="$message" \
        -f body="Localized files" \
        -f head="$branch" \
        -f base="$(BASE_BRANCH)"
    else
      echo "No changes since last run"
    fi
  displayName: Create Pull Request
  env:
    GH_TOKEN: $(GH_TOKEN)
    EMAIL: $(EMAIL)
    NAME: $(NAME)
