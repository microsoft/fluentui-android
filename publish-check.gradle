project.ext.artifactExists = { repo, artifactId, artifactVersion ->
    def groupId = 'com/microsoft/fluentui'
    def pomFileName = artifactId+"-"+artifactVersion+".pom"
    def artifactPath = groupId+"/"+artifactId+"/"+artifactVersion+"/"+pomFileName
    def url = 'https://pkgs.dev.azure.com/microsoftdesign/fluentui-native/_packaging/fluentui-android/maven/v1'
    // Internal pipelines (see cfs-init.gradle) run under 1ES Network Isolation, which forbids calling repo1.maven.org.
    // There Maven Central is queried through a feed whose only upstream is Maven Central and which holds no packages
    // of its own, so a version resolves there exactly when it is on Maven Central.
    def viaCentralProxyFeed = repo != "feed" && System.getenv('CFS_FEED_TOKEN') != null
    if(repo != "feed"){
        url = viaCentralProxyFeed ? 'https://pkgs.dev.azure.com/microsoftdesign/fluentui-native/_packaging/fluentuigithubtest/maven/v1' : 'https://repo1.maven.org/maven2'
    }
    def repositoryUrl = url+"/"+artifactPath

    try {
        def connection = (HttpURLConnection) new URL(repositoryUrl).openConnection()

        if(repo == "feed" || viaCentralProxyFeed){
            connection.setRequestProperty("Authorization", "Basic " + getBase64EncodedCredentials())
        }
        connection.setConnectTimeout(10000)
        connection.setReadTimeout(10000)
        connection.setRequestMethod("HEAD")

        def responseCode = connection.getResponseCode()

        // A wrong answer here would re-release already published versions, so fail instead of guessing.
        if (viaCentralProxyFeed && responseCode != 200 && responseCode != 404) {
            throw new GradleException("HTTP ${responseCode} while checking ${repositoryUrl}")
        }

        return (200 == responseCode)

    } catch (IOException ignored) {
        if (viaCentralProxyFeed) {
            throw new GradleException("Could not check ${repositoryUrl}", ignored)
        }
        println(ignored)
        return false
    }
}

def getBase64EncodedCredentials() {
    Map<String, ?> properties = project.getProperties();
    def username = project.hasProperty("mavenUserName") ? properties.get("mavenUsername") : ""
    def password = project.hasProperty("mavenPassword") ? properties.get("mavenPassword") : ""
    def s = username + ":" + password
    return s.bytes.encodeBase64().toString()
}