// Gradle init script for internal Azure Pipelines builds (pass it with --init-script).
// 1ES Network Isolation (SFI ES4.2.4, CFSClean/CFSClean2 policies) forbids builds from reaching public
// package registries such as repo1.maven.org, jcenter.bintray.com and plugins.gradle.org. This script
// replaces every remote Maven repository declared by the build with the TestFluent Azure Artifacts feed,
// whose Maven upstreams are only public sources (Maven Central, Google Maven, Gradle Plugin Portal), so every
// package is served complete. (The Office feed is not used: its internal upstreams can serve incomplete
// packages, e.g. okhttp 3.10.0 without its jar.)
// Requires AZURE_ARTIFACTS_ENV_ACCESS_TOKEN: a microsoftdesign PAT, e.g. mapped from $(mavenPassword).

def cfsFeedName = 'TestFluentCfsFeed'
def cfsFeedUrl = 'https://pkgs.dev.azure.com/microsoftdesign/fluentui-native/_packaging/TestFluent/maven/v1'
def cfsToken = System.getenv('AZURE_ARTIFACTS_ENV_ACCESS_TOKEN')
if (!cfsToken) {
    throw new GradleException('cfs-init.gradle: AZURE_ARTIFACTS_ENV_ACCESS_TOKEN must be set to authenticate to ' + cfsFeedUrl)
}

// Fail fast with Azure DevOps's own reason if the feed rejects the token (e.g. an expired PAT);
// otherwise dependency resolution only reports a bare "401 Unauthorized".
def probe = (HttpURLConnection) new URL(cfsFeedUrl + '/junit/junit/4.12/junit-4.12.pom').openConnection()
probe.setRequestProperty('Authorization', 'Basic ' + ('AzureDevOps:' + cfsToken).bytes.encodeBase64().toString())
probe.connectTimeout = 30000
probe.readTimeout = 30000
def probeStatus = probe.responseCode
if (probeStatus in [401, 403]) {
    def reason = probe.getHeaderField('X-TFS-ServiceError')
    reason = reason ? URLDecoder.decode(reason, 'UTF-8') : (probe.errorStream?.text?.take(300) ?: 'no reason given')
    def hints = ["token length ${cfsToken.length()}", "ActivityId ${probe.getHeaderField('ActivityId')}"]
    if (cfsToken != cfsToken.trim()) {
        hints << 'the token has leading/trailing whitespace'
    }
    if (cfsToken.startsWith('$(')) {
        hints << 'the pipeline variable was not expanded'
    }
    throw new GradleException("cfs-init.gradle: ${cfsFeedUrl} rejected AZURE_ARTIFACTS_ENV_ACCESS_TOKEN (HTTP ${probeStatus}: ${reason}; ${hints.join('; ')})" +
            '. If it is the mavenPassword PAT, create a new microsoftdesign PAT with Packaging (Read & write) scope and update the pipeline variable.')
}
probe.disconnect()

def useCfsFeed = { RepositoryHandler repositories ->
    repositories.all { ArtifactRepository repo ->
        if (repo instanceof MavenArtifactRepository && repo.name != cfsFeedName && repo.url.scheme in ['http', 'https']) {
            logger.info("cfs-init.gradle: replacing repository ${repo.name} (${repo.url}) with ${cfsFeedUrl}")
            repositories.remove(repo)
            if (repositories.findByName(cfsFeedName) == null) {
                repositories.maven {
                    name = cfsFeedName
                    url = cfsFeedUrl
                    credentials {
                        username = 'AzureDevOps'
                        password = cfsToken
                    }
                }
            }
        }
    }
}

allprojects {
    useCfsFeed(buildscript.repositories)
    useCfsFeed(repositories)

    // Robolectric downloads its Android runtime jars at test time, bypassing Gradle's repositories
    // (default: repo1.maven.org). Point it at the same feed.
    tasks.withType(Test).configureEach {
        systemProperty 'robolectric.dependency.repo.url', cfsFeedUrl
        systemProperty 'robolectric.dependency.repo.username', 'AzureDevOps'
        systemProperty 'robolectric.dependency.repo.password', cfsToken
    }
}
